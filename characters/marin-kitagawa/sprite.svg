<svg id="pet-sprite" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" class="state-idle">
  <style>
    #pet-sprite { width: 100%; height: 100%; overflow: visible; }

    #float-group { animation: float 3.2s ease-in-out infinite; transform-origin: 100px 170px; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    #lid-left, #lid-right {
      transform: scaleY(0);
      transform-box: fill-box;
      transform-origin: top;
      animation: blink 5.4s ease-in-out infinite;
    }
    #lid-right { animation-delay: 0.02s; }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(0); }
      95% { transform: scaleY(1); }
    }

    #arm-right { transform-box: fill-box; transform-origin: 140px 172px; }
    #pet-sprite.state-click #arm-right {
      animation: wave 0.55s ease-in-out 2;
    }
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-22deg); }
    }

    #pet-sprite.state-drag #float-group {
      animation: none;
      transform: rotate(-5deg) translateY(-4px);
    }

    #pet-sprite.state-sleep #float-group { animation: none; }
    #pet-sprite.state-sleep #lid-left,
    #pet-sprite.state-sleep #lid-right { animation: none; transform: scaleY(1); }
  </style>

  <g id="float-group">
    <g id="tails">
      <ellipse cx="38" cy="95" rx="20" ry="46" fill="#f6c667" transform="rotate(-10 38 95)"/>
      <ellipse cx="162" cy="95" rx="20" ry="46" fill="#f6c667" transform="rotate(10 162 95)"/>
    </g>

    <g id="body">
      <path d="M60 170 Q100 150 140 170 L148 230 L52 230 Z" fill="#ff6f91"/>
      <path d="M70 168 L80 150 L120 150 L130 168" fill="none" stroke="#ff4d73" stroke-width="3" stroke-linecap="round"/>
    </g>

    <g id="arm-left">
      <path d="M65 172 Q55 190 60 210" stroke="#ffe3c2" stroke-width="16" stroke-linecap="round" fill="none"/>
    </g>

    <g id="head">
      <circle cx="100" cy="100" r="58" fill="#ffe3c2"/>
      <path d="M46 90 Q60 50 100 48 Q140 50 154 90 Q120 72 100 72 Q80 72 46 90 Z" fill="#f6c667"/>

      <ellipse cx="80" cy="104" rx="9" ry="12" fill="#3a2e2e"/>
      <ellipse cx="120" cy="104" rx="9" ry="12" fill="#3a2e2e"/>
      <circle cx="83" cy="99" r="3" fill="#fff"/>
      <circle cx="123" cy="99" r="3" fill="#fff"/>
      <rect id="lid-left" x="68" y="88" width="24" height="16" fill="#ffe3c2"/>
      <rect id="lid-right" x="108" y="88" width="24" height="16" fill="#ffe3c2"/>

      <ellipse cx="68" cy="118" rx="8" ry="5" fill="#ff9eb5" opacity="0.6"/>
      <ellipse cx="132" cy="118" rx="8" ry="5" fill="#ff9eb5" opacity="0.6"/>
      <path d="M90 128 Q100 134 110 128" stroke="#a65d4e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

    <g id="arm-right">
      <path d="M135 172 Q158 160 160 130" stroke="#ffe3c2" stroke-width="16" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>
