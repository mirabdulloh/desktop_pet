<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src pet-asset: blob: data:; connect-src pet-asset:;"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="particles"></div>
    <div id="speech-bubble"></div>
    <form id="chat" autocomplete="off" hidden>
      <p id="chat-note" hidden></p>
      <div class="chat-row">
        <input id="chat-input" maxlength="2000" spellcheck="false" />
        <button id="chat-send" type="submit">Send</button>
        <button id="chat-close" type="button" aria-label="Close chat">×</button>
      </div>
    </form>
    <script src="../../vendor/live2d/live2dcubismcore.min.js"></script>
    <script src="bundle.js"></script>
  </body>
</html>
